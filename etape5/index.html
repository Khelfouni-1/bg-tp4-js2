<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../etape1/index.css">
    <title>Etape 1 JavaScript</title>
</head>


<body>

<div class="table-container">

    <div class="form_container">
        <div class="form_group">
            <label class="form_label">Nom :</label>
            <input type="text" id="form_nom" class="form_field">
        </div>
        <div class="form_group">
            <label class="form_label">Prenom :</label>
            <input type="text" id="form_prenom" class="form_field">
        </div>
        <div class="form_group">
            <label class="form_label">Points :</label>
            <input type="number" id="form_points" class="form_field">
        </div>
        <button onclick="doNewData()" class="AddButton">
            Ajouter
        </button>
    </div>

    <table id="Table">
        <tr class="FirstRow">
            <td class="col_number">Num</td>
            <td class="col_text">Nom</td>
            <td class="col_text">Prenom</td>
            <td class="col_number">Points</td>
            <td class="col_checkbox">Select</td>
        </tr>

    </table>

    <div id="cantair_summary">
        <p id="p1"> 0 ligne (s)</p>
        <p id="p2"></p>
        <p id="p3">Total Point (s) = 0</p>
    </div>

    <button class="ConsolButton" onclick="consoleTableau()">Console Tableau</button>
</div>

<script src="index.js"></script>


</body>
